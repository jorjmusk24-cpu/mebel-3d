<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2a37">
<title>O-5b 19.10</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --ink: #1f2a37; --muted: #6b7684; --line: #d9dee5;
    --accent: #1565c0; --hit: #e53935; --shadow: 0 6px 24px rgba(20, 30, 45, .14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }

  #panel { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 5;
    background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 10px; }
  #title { position: fixed; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 4; font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(255,255,255,.85); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); }
  body.has-info #title { display: none; }
  #title b { color: var(--ink); }
  .row { display: flex; gap: 8px; }
  .search { flex: 1 1 0; min-width: 0; display: flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .search:focus-within { border-color: var(--accent); }
  .search label { padding: 0 8px; display: flex; align-items: center; font-size: 13px; color: var(--muted); background: #f4f6f9; white-space: nowrap; border-right: 1px solid var(--line); }
  .search input::placeholder { color: #b3bac4; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: 17px; padding: 9px 8px; color: var(--ink); background: transparent; }
  .search button { border: 0; background: var(--accent); color: #fff; padding: 0 12px; font-size: 16px; cursor: pointer; }

  #nav { display: none; margin-bottom: 8px; align-items: center; gap: 8px; }
  #nav.on { display: flex; }
  #nav button { border: 0; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #prev { background: #e8edf3; color: var(--ink); }
  #next { background: var(--accent); color: #fff; flex: 1; }
  #count { min-width: 64px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  #stop { background: transparent; color: var(--muted); padding: 10px 6px !important; }

  #info { position: fixed; left: 10px; right: 10px; top: calc(10px + env(safe-area-inset-top)); z-index: 5;
    background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; display: none; }
  #info.on { display: flex; align-items: center; gap: 10px; }
  #info .itxt { flex: 1 1 auto; min-width: 0; }
  #info .idraw { flex: 0 0 auto; line-height: 0; }
  #info .idraw svg { display: block; max-width: 44vw; height: auto; }
  #info .h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #info .num { color: var(--hit); font-weight: 800; font-size: 20px; }
  #info .sz { font-weight: 700; font-size: 16px; }
  #info .mat { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #info .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #info .tag { background: #f1f4f8; border-radius: 6px; padding: 2px 8px; font-size: 13px; }

  #home { position: fixed; right: 12px; z-index: 4; bottom: calc(96px + env(safe-area-inset-bottom));
    width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--panel); box-shadow: var(--shadow);
    font-size: 22px; color: var(--ink); cursor: pointer; }

  /* logotip: chap pastda, fonsiz; model kattalashtirilganda ham o'rni va o'lchami o'zgarmaydi */
  #brand { position: fixed; left: 14px; z-index: 4; height: 46px; width: auto; pointer-events: none; user-select: none; }
  #toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9; background: rgba(31, 42, 55, .92);
    color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; text-align: center; max-width: 80vw;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); z-index: 8; background: var(--bg); }

  @media (min-width: 900px) {
    #panel { right: auto; width: 340px; }
    .row { flex-direction: column; }
    #info, #title { right: auto; width: 340px; }
    #home { bottom: calc(14px + env(safe-area-inset-bottom)); }
  }
</style>
</head>

</div>

	// This set of controls performs orbiting, dollying (zooming), and panning.
	// Unlike TrackballControls, it maintains the "up" direction object.up (+Y by default).
	//
	//    Orbit - left mouse / touch: one-finger move
	//    Zoom - middle mouse, or mousewheel / touch: two-finger spread or squish
	//    Pan - right mouse, or left mouse + ctrl/meta/shiftKey, or arrow keys / touch: two-finger move

	const _changeEvent = {
		type: 'change'
	};

	};

	};

			this.minDistance = 0;
			this.maxDistance = Infinity;

			this.minZoom = 0;
			this.maxZoom = Infinity;

			this.maxPolarAngle = Math.PI; // radians

			this.dampingFactor = 0.05;

<script>
(function () {

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function b64f(s) {

  // ---------- sahna ----------

  camera.up.set(0, 0, 1); // SketchUp: Z yuqoriga
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a929c, 0.75));
  var sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.position.set(0.4, -0.3, 1);
  camera.add(sun);
  scene.add(camera);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  // ---------- detallar ----------
  var parts = {};           // id -> { info, meshes, lines, box }
  D.parts.forEach(function (p) { parts[p.id] = { info: p, meshes: [], lines: [], box: new THREE.Box3() }; });
  var allMeshes = [], allLines = [], worldBox = new THREE.Box3();
  var ghost = new THREE.MeshLambertMaterial({ color: 0xc3cad3, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide });
  // qizil detal xira detallardan keyin chiziladi: boshqa detallar ortida qolsa ham aniq ko'rinadi
  var hitMat = new THREE.MeshLambertMaterial({ color: 0xe53935, emissive: 0x5a0000, side: THREE.DoubleSide, transparent: true, opacity: 1, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  // ajratilgan detalda kromkali yuzalar o'z rangida qoladi (yorqinroq)
  var edgeHit = {

  var lineMat = new THREE.LineBasicMaterial({ color: 0x2b3440, transparent: true, opacity: 0.55 });
  var lineGhost = new THREE.LineBasicMaterial({ color: 0x8893a0, transparent: true, opacity: 0.12 });
  var lineHit = new THREE.LineBasicMaterial({ color: 0x7f0000, transparent: true });

  D.meshes.forEach(function (m) {
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(b64f(m.p), 3));

  });
  if (worldBox.isEmpty()) worldBox.set(new THREE.Vector3(-500, -500, 0), new THREE.Vector3(500, 500, 1000));

  // ---------- kamera ----------
  var anim = null;
  function fitBox(box, dir, k) {
    var c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    var r = Math.max(s.length() / 2, 150);
    var fov = camera.fov * Math.PI / 180;
    var fit = r / Math.sin(Math.min(fov, fov * camera.aspect) / 2);
    return { target: c, pos: c.clone().add(dir.clone().normalize().multiplyScalar(fit * (k || 1))) };
  }
  function flyTo(v, ms) {

      camera.position.lerpVectors(p0, v.pos, e);
      controls.target.lerpVectors(t0, v.target, e);

    };
  }
  var HOME_DIR = new THREE.Vector3(1, -1.35, 0.95);
  function home(ms) { flyTo(fitBox(worldBox, HOME_DIR, 1.0), ms); }
  function focusPart(p) {
    var dir = camera.position.clone().sub(controls.target);
    if (dir.lengthSq() < 1) dir.copy(HOME_DIR);
    // detal juda yassi tomondan ko'rinmasin: ko'rish yo'nalishini biroz yuqoriga og'diramiz
    dir.normalize(); if (dir.z < 0.25) { dir.z = 0.35; dir.normalize(); }
    flyTo(fitBox(p.box, dir, 1.35));
  }

  // ---------- ajratib ko'rsatish ----------
  function highlight(id) {
    allMeshes.forEach(function (m) { m.material = id == null ? m.userData.base : (m.userData.owner === id ? (m.userData.k ? (edgeHit[m.userData.k] || hitMat) : hitMat) : ghost); m.renderOrder = m.userData.owner === id ? 2 : 0; });
    allLines.forEach(function (l) { l.renderOrder = l.userData.owner === id ? 3 : 0; });
    allLines.forEach(function (l) { l.material = id == null ? lineMat : (l.userData.owner === id ? lineHit : lineGhost); });
  }

  // ---------- ma'lumot kartasi ----------
  function showInfo(p) {
    if (!p) { $('info').classList.remove('on'); document.body.classList.remove('has-info'); return; }
    var i = p.info, mat = D.mats[i.g] || '';
    var h = '<div class="h"><span class="num">#' + i.n + '</span><span class="sz">' + fmt(i.L) + ' × ' + fmt(i.W) + ' × ' + fmt(i.T) + '</span></div>' +
      '<div class="mat">' + esc(mat) + '</div><div class="tags">' +
      '<span class="tag">Birka: <b>' + (i.b ? i.b : '—') + '</b></span>' +
      (i.name ? '<span class="tag">' + esc(i.name) + '</span>' : '') +
      (i.cab ? '<span class="tag">' + esc(i.cab) + '</span>' : '') + '</div>';
    $('info').innerHTML = '<div class="itxt">' + h + '</div><div class="idraw">' + partSVG(i) + '</div>';
    $('info').classList.add('on'); document.body.classList.add('has-info');
  }
  function fmt(x) { return (Math.round(x * 10) / 10).toString(); }

  // ---------- detal chizmasi (raskroy listidagidek: rang, o'lchamlar, kromka belgilari) ----------
  var COLORS = ['#fff06a', '#c4f5f4', '#f9d0c4', '#d7f5c4', '#e2d4f7', '#fde2a7', '#cfe3fb', '#f7c9de', '#d9ecd0', '#f4e1c9', '#c9efe0', '#eadbc8'];
  function mark(t, cx, cy, len, vert, f, inward, atEnd, vrot) {
    if (!t) return '';
    var sw = Math.max(f * 0.1, 1.2), o = vert
      ? '<line x1="' + cx + '" y1="' + (cy - len / 2) + '" x2="' + cx + '" y2="' + (cy + len / 2) + '" stroke="#111" stroke-width="' + sw + '"/>'
      : '<line x1="' + (cx - len / 2) + '" y1="' + cy + '" x2="' + (cx + len / 2) + '" y2="' + cy + '" stroke="#111" stroke-width="' + sw + '"/>';
    if (t !== 1) return o;
    var uf = f * (atEnd ? 0.85 : 0.65), d = inward || 1, tx, ty, T = function (x, y, rot, extra) {
      return '<text x="' + x + '" y="' + y + '" font-size="' + uf + '" font-weight="700" fill="#111" ' + (extra || 'text-anchor="middle" dominant-baseline="central"') + (rot ? ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"' : '') + '>УС</text>';
    };
    if (atEnd) {
      if (vert) { tx = cx + d * (sw / 2 + uf * 0.55); ty = vrot ? cy + len / 2 - uf * 0.75 : cy - len / 2 + uf * 0.75; return o + T(tx, ty, vrot || -90); }
      return o + T(cx + len / 2 + uf * 0.2, d > 0 ? cy + sw / 2 : cy - sw / 2, 0, 'dominant-baseline="' + (d > 0 ? 'hanging' : 'alphabetic') + '"');
    }
    if (vert) return o + T(cx + d * (sw / 2 + uf * 0.55), cy, -90);
    return o + T(cx, cy + d * (sw / 2 + uf * 0.55), 0);
  }
  function dimT(x, y, f, txt, rot, anchor) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + f + '" fill="#1a3fd6" text-anchor="' + (anchor || 'middle') + '"' + (rot ? ' transform="rotate(-90 ' + x + ' ' + y + ')"' : '') + '>' + txt + '</text>';
  }
  function partSVG(i) {
    var e = i.e || [0, 0, 0, 0], s = { top: e[0], bottom: e[1], left: e[2], right: e[3] };
    var BW = 172, BH = 96, L = +i.L || 1, Wd = +i.W || 1, o = '';
    // juda ingichka detal ham o'qiladigan bo'lishi uchun nisbat cheklanadi (o'lchamlar haqiqiy qiymatda yoziladi)
    var a = L, b = Wd, R = 4;
    if (a / b > R) b = a / R; if (b / a > R) a = b / R;
    var k = Math.min((BW - 4) / a, (BH - 4) / b), w = a * k, h = b * k, x = (BW - w) / 2, y = (BH - h) / 2;
    o += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + COLORS[((i.n || 1) - 1) % COLORS.length] + '" stroke="#333" stroke-width="1"/>';
    var sh = Math.min(w, h);
    if (Math.max(w, h) / sh >= 2.4) {
      // ingichka detal: o'lchamlar bir qatorda, kromka chiziqlari chetdan ichkarida
      var vert = h > w, Wt = vert ? h : w, Ht = vert ? w : h, X = BW / 2 - Wt / 2, Y = BH / 2 - Ht / 2, ss = vert ? { top: s.left, bottom: s.right, left: s.bottom, right: s.top } : s;
      var f = Math.min(Ht * 0.42, 15), m = Math.max(Ht * 0.15, 3), cy = Y + Ht / 2, mf = f * 0.85, g = '';
      g += dimT(BW / 2, cy + f * 0.36, f, fmt(vert ? Wd : L));
      g += mark(ss.top, BW / 2, Y + m, Math.min(f * 3.2, Wt * 0.4), false, mf, 1, true);
      g += mark(ss.bottom, BW / 2, Y + Ht - m, Math.min(f * 3.2, Wt * 0.4), false, mf, -1, true);
      g += mark(ss.left, X + m, cy, Ht - 2 * m - 2, true, mf, 1, true, vert ? 90 : 0);
      g += mark(ss.right, X + Wt - m, cy, Ht - 2 * m - 2, true, mf, -1, true, vert ? 90 : 0);
      g += dimT(X + m + f * 0.3 + (ss.left === 1 ? mf * 1.02 : 0), cy + f * 0.36, f, fmt(vert ? L : Wd), false, 'start');

      o += dimT(x + w / 2, y + f2 * 1.05, f2, fmt(L));
      o += mark(s.top, x + w / 2, y + ins, Math.min(f2 * 2.6, w * 0.8), false, f2, 1);
      o += mark(s.bottom, x + w / 2, y + h - ins, Math.min(f2 * 2.6, w * 0.8), false, f2, -1);
      o += dimT(x + f2 * 1.05, y + h / 2, f2, fmt(Wd), true);
      o += mark(s.left, x + ins, y + h / 2, Math.min(f2 * 2.6, h * 0.8), true, f2, 1);
      o += mark(s.right, x + w - ins, y + h / 2, Math.min(f2 * 2.6, h * 0.8), true, f2, -1);

  }

  var toastT = null;

  $('fBirka').addEventListener('submit', function (e) {

    clearAll(false);
    var p = null;
    D.parts.forEach(function (x) { if (!p && x.b === n) p = parts[x.id]; });
    if (!p) { toast('Birka ' + n + ' topilmadi'); return; }
    show(p);
  });

  $('fNum').addEventListener('submit', function (e) {
    e.preventDefault();
    var n = num($('qNum').value); $('qNum').blur();
    if (n == null) return;
    clearAll(false);
    list = D.parts.filter(function (x) { return x.n === n; }).sort(function (a, b) {
      return a.g - b.g || String(a.cab || '').localeCompare(String(b.cab || '')) || (a.b || 1e9) - (b.b || 1e9);
    }).map(function (x) { return parts[x.id]; });
    if (!list.length) { toast('#' + n + ' topilmadi'); return; }
    pos = 0; step();
  });
  function step() {
    $('nav').classList.add('on');
    $('count').textContent = (pos + 1) + ' / ' + list.length;
    $('prev').disabled = pos === 0; $('prev').style.opacity = pos === 0 ? 0.4 : 1;
    show(list[pos]);
  }
  $('next').addEventListener('click', function () {
    if (pos < list.length - 1) { pos++; step(); return; }
    var k = list.length;
    clearAll(true);
    toast('Hammasi ko\'rildi (' + k + ' ta)');
  });
  $('prev').addEventListener('click', function () { if (pos > 0) { pos--; step(); } });
  $('stop').addEventListener('click', function () { clearAll(true); });
  $('home').addEventListener('click', function () { home(); });

  // ---------- detalga bosish ----------
  var ray = new THREE.Raycaster(), down = null;
  renderer.domElement.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY, t: performance.now(), n: e.isPrimary }; });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (!down || !e.isPrimary) return;
    var moved = Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y), dt = performance.now() - down.t;
    down = null;
    if (moved > 8 || dt > 450) return;
    var r = renderer.domElement.getBoundingClientRect();
    ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, camera);
    var hits = ray.intersectObjects(allMeshes, false);
    for (var i = 0; i < hits.length; i++) {
      var o = hits[i].object.userData.owner;
      if (o && parts[o]) {
        list = []; pos = -1; $('nav').classList.remove('on');
        highlight(o); showInfo(parts[o]);
        return;
      }
    }
    // bo'sh joyga bosildi: tanlangan detaldan chiqib, to'liq ko'rinishga qaytish
    // (#N bo'yicha ketma-ket ko'rish paytida bunday qilinmaydi — u "✕" bilan yopiladi)
    if (!list.length && $('info').classList.contains('on')) clearAll(true);
  });

  // ---------- chizish ----------
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  if (!/^data:image/.test($('brand').getAttribute('src') || '')) $('brand').style.display = 'none';
  function placeHome() {
    if (window.innerWidth >= 900) { $('home').style.bottom = ''; $('brand').style.bottom = '14px'; $('brand').style.left = '370px'; return; }
    $('home').style.bottom = ($('panel').offsetHeight + 22) + 'px';
    $('brand').style.bottom = ($('panel').offsetHeight + 22) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(placeHome).observe($('panel'));
  window.addEventListener('resize', function () { resize(); placeHome(); });
  placeHome();
  resize();
  home(0);
  $('loading').style.display = 'none';
  (function loop(now) {
    requestAnimationFrame(loop);
    if (anim) anim(now);
    controls.update();
    renderer.render(scene, camera);
  })(performance.now());
})();
</script>
</body>
</html>
